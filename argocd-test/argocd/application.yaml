apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runway-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # 이 저장소의 chart/ 를 Helm 으로 배포하고, values-dev.yaml 로 값을 오버라이드한다.
    repoURL: https://github.com/qkrgmlxo4655/test.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - values-dev.yaml   # chart/values.yaml(기본값) 위에 덮어씀
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
